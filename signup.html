<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="loginbody">
    <a href="index.html"><button class="signup" id="backbtn">Back</button></a>
    <div class="logincontainer">
        <div class="innerlogin">
        <h2 style="margin-bottom: 1.5rem;">Signup</h2>
        <h4 >Your Name</h4>
        <input class="logininput" type="text" id="name" placeholder="my good name">
        <h4>Emain ID</h4>
        <input class="logininput" id="emailsignup" type="email" placeholder=" @gmail.com">
        <h4>password</h4>
        <input type="password" class="logininput" id="passwordsignup" placeholder="password">
        </div>
        <button id="signup" class="signup" style="align-items: center;margin-bottom: 1.5rem;">sign up</button>
        <p style="margin-bottom: 0.5rem;">already have an account?</p>
        <a href="login.html" style="align-items: center;margin-bottom: 1.5rem;"><button class="signup"id="log">login</button></a>
        </div>
    </div>
    <script type="module" src="auth.js"></script>
</body>
</html>
